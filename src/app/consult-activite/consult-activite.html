<h2>Detail de l'activité:</h2>
@if (activite !== undefined) {
  <ol>
    <li>
      Nom de l'activité:
      @if (enEdition) {
        <input type="text" class="txt" [(ngModel)]="titreEdite" />
      } @else {
        <b>{{ activite }}</b>
      }
    </li>
  </ol>
  <button class="btn btn-supprimer" (click)="supprimeElem(index)">Supprimer</button>
  @if (enEdition) {
    <button class="btn btn-modifier" (click)="sauvegarderElem(index)">Sauvegarder</button>
  } @else {
    <button class="btn btn-modifier" (click)="modifierElem()">Modifier</button>
    <button class="btn btn-retour" (click)="retour()">Retour</button>
  }
} @else {
  <p>Aucune activité ne correspond à l'indice {{ id }}.</p>
  <button class="btn btn-retour" (click)="retour()">Retour</button>
}
